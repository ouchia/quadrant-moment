<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>寸度</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="寸度">
  <meta name="theme-color" content="#ffffff" id="theme-color-meta">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23171717' rx='20'/><text x='50' y='64' font-size='48' font-family='sans-serif' text-anchor='middle' fill='%23ffffff' font-weight='600'>寸</text></svg>">
  
  <!-- 動態生成並注入符合 Android 安裝標準的 Web Manifest -->
  <link rel="manifest" id="pwa-manifest">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['"SF Mono"', 'ui-monospace', 'Menlo', 'monospace']
          },
          colors: {
            mono: {
              50: '#fafafa',
              100: '#f5f5f5',
              200: '#e5e5e5',
              300: '#d4d4d4',
              400: '#a3a3a3',
              500: '#737373',
              600: '#525252',
              700: '#404040',
              800: '#262626',
              900: '#171717',
              950: '#0a0a0a'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS 安全區域適配與極簡原生感 */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, button {
      user-select: auto;
    }
    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-mono-50 dark:bg-mono-950 text-mono-900 dark:text-mono-100 min-h-screen transition-colors duration-200 antialiased font-sans flex flex-col justify-between selection:bg-mono-300 dark:selection:bg-mono-700">

  <!-- 主容器 -->
  <div class="max-w-md w-full mx-auto flex-1 flex flex-col px-3.5 pt-2 pb-20">

    <!-- 頂部列：極簡標題與模式切換 -->
    <header class="flex items-center justify-between py-2 border-b border-mono-200 dark:border-mono-800">
      <div class="flex flex-col items-start justify-center">
        <span id="header-today-date" class="text-[10px] font-mono text-mono-400 dark:text-mono-500 leading-tight"></span>
        <h1 class="text-base font-semibold tracking-wider">寸度</h1>
      </div>
      <div class="flex items-center space-x-0.5">
        <!-- 小日曆切換按鈕 -->
        <button id="toggle-calendar-btn" title="查看日曆" class="p-1.5 text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </button>
        <!-- 備份資料按鈕 -->
        <button id="backup-btn" title="備份 / 還原" class="p-1.5 text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
          </svg>
        </button>
        <!-- 主題切換 -->
        <button id="theme-toggle" class="p-1.5 text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 transition-colors" aria-label="Toggle Theme">
          <svg id="theme-icon-light" class="w-3.5 h-3.5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="theme-icon-dark" class="w-3.5 h-3.5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 極簡可收合小日曆 -->
    <div id="calendar-drawer" class="hidden py-2 border-b border-mono-200 dark:border-mono-800 transition-all">
      <div class="rounded-lg border border-mono-200 dark:border-mono-800 bg-white/60 dark:bg-mono-900/40 p-2.5">
        <div class="flex items-center justify-between text-xs pb-2 border-b border-mono-100 dark:border-mono-800">
          <button id="cal-prev-month" class="p-1 text-mono-400 hover:text-mono-900 dark:hover:text-mono-100">&lt;</button>
          <div class="flex items-center space-x-1 font-mono font-medium text-mono-800 dark:text-mono-200">
            <select id="cal-year-select" class="bg-transparent border border-mono-200 dark:border-mono-700 rounded px-1 py-0.5 text-xs text-mono-800 dark:text-mono-200 focus:outline-none cursor-pointer">
              <!-- 動態載入年份 -->
            </select>
            <select id="cal-month-select" class="bg-transparent border border-mono-200 dark:border-mono-700 rounded px-1 py-0.5 text-xs text-mono-800 dark:text-mono-200 focus:outline-none cursor-pointer">
              <!-- 動態載入月份 -->
            </select>
            <button id="cal-this-month-btn" type="button" class="text-[10px] px-1.5 py-0.5 rounded border border-mono-200 dark:border-mono-700 hover:bg-mono-200 dark:hover:bg-mono-800 text-mono-600 dark:text-mono-400 transition-colors">本月</button>
          </div>
          <button id="cal-next-month" class="p-1 text-mono-400 hover:text-mono-900 dark:hover:text-mono-100">&gt;</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center pt-2 text-[10px] font-mono text-mono-400 dark:text-mono-500">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="cal-days-grid" class="grid grid-cols-7 gap-1 pt-1.5 text-xs font-mono">
          <!-- 動態載入日期天數 -->
        </div>

        <!-- 點擊日期後的內嵌完成細項列表 (非彈窗) -->
        <div id="cal-selected-day-container" class="hidden mt-2 pt-2 border-t border-mono-100 dark:border-mono-800 transition-all">
          <div class="flex items-center justify-between pb-1.5 text-[11px] font-mono">
            <span id="cal-selected-date-label" class="font-medium text-mono-700 dark:text-mono-300"></span>
            <span id="cal-selected-count" class="text-[10px] text-mono-400"></span>
          </div>
          <ul id="cal-selected-items-list" class="space-y-1 text-xs max-h-48 overflow-y-auto no-scrollbar">
            <!-- 動態載入該日完成項目 -->
          </ul>
        </div>
      </div>
    </div>

    <!-- 分類四宮格區 (已移除右側獨立追蹤項目卡片) -->
    <div class="py-2.5">
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <button class="cat-btn py-1.5 px-2.5 rounded border border-mono-200 dark:border-mono-800 bg-mono-50 dark:bg-mono-950 text-left transition-all flex items-center justify-between text-mono-700 dark:text-mono-300" data-category="問題">
          <span class="tracking-wide">問題</span>
          <span class="text-[10px] font-mono text-mono-400 cat-badge" id="badge-問題">0</span>
        </button>
        <button class="cat-btn py-1.5 px-2.5 rounded border border-mono-200 dark:border-mono-800 bg-mono-50 dark:bg-mono-950 text-left transition-all flex items-center justify-between text-mono-700 dark:text-mono-300" data-category="感恩">
          <span class="tracking-wide">感恩</span>
          <span class="text-[10px] font-mono text-mono-400 cat-badge" id="badge-感恩">0</span>
        </button>
        <button class="cat-btn py-1.5 px-2.5 rounded border border-mono-200 dark:border-mono-800 bg-mono-50 dark:bg-mono-950 text-left transition-all flex items-center justify-between text-mono-700 dark:text-mono-300" data-category="開心">
          <span class="tracking-wide">開心</span>
          <span class="text-[10px] font-mono text-mono-400 cat-badge" id="badge-開心">0</span>
        </button>
        <button class="cat-btn py-1.5 px-2.5 rounded border border-mono-200 dark:border-mono-800 bg-mono-50 dark:bg-mono-950 text-left transition-all flex items-center justify-between text-mono-700 dark:text-mono-300" data-category="難受">
          <span class="tracking-wide">難受</span>
          <span class="text-[10px] font-mono text-mono-400 cat-badge" id="badge-難受">0</span>
        </button>
      </div>
    </div>

    <!-- 今日預計完成區塊 (常駐區塊，可直接在此快速新增與指定項目) -->
    <div id="today-tasks-section" class="mb-2">
      <div class="rounded-lg border border-mono-200 dark:border-mono-800 bg-white/70 dark:bg-mono-900/50 p-2.5 space-y-1.5">
        <div class="flex items-center justify-between text-[11px]">
          <span class="font-medium text-mono-700 dark:text-mono-300 flex items-center space-x-1.5">
            <span>預計今日完成</span>
            <span id="today-tasks-count" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-mono-200/70 dark:bg-mono-800 text-mono-700 dark:text-mono-300">0</span>
          </span>
          <button id="quick-add-today-task-btn" type="button" class="text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 p-0.5 rounded text-xs flex items-center space-x-0.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </button>
        </div>
        <ul id="today-tasks-list" class="space-y-1">
          <!-- 動態載入今日任務 -->
        </ul>
      </div>
    </div>

    <!-- 檢視狀態切換：進行中 (數量) / 封存 (數量) + 整理模式按鈕 -->
    <div class="flex items-center justify-between pb-1.5 px-0.5 text-[11px]">
      <div class="flex items-center space-x-2.5">
        <button id="view-active-btn" class="flex items-center space-x-1.5 text-xs font-medium text-mono-900 dark:text-mono-100">
          <span class="tab-label underline underline-offset-4 decoration-1">進行中</span>
          <span id="active-count" class="no-underline inline-block text-[10px] font-mono px-1.5 py-0.2 rounded bg-mono-200/70 dark:bg-mono-800 text-mono-700 dark:text-mono-300">0</span>
        </button>
        <span class="text-mono-300 dark:text-mono-700">/</span>
        <button id="view-archived-btn" class="flex items-center space-x-1.5 text-xs text-mono-400 hover:text-mono-700 dark:hover:text-mono-300 transition-colors">
          <span class="tab-label">封存匣</span>
          <span id="archive-count" class="no-underline inline-block text-[10px] font-mono px-1.5 py-0.2 rounded bg-mono-200/50 dark:bg-mono-800/60 text-mono-500 dark:text-mono-400">0</span>
        </button>
      </div>

      <!-- 整理按鈕：啟動手勢與置頂管理 -->
      <button id="toggle-manage-btn" class="text-[11px] px-2 py-0.5 rounded border border-mono-200 dark:border-mono-800 text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 hover:border-mono-400 transition-all font-mono flex items-center space-x-1">
        <span id="manage-btn-text">整理</span>
      </button>
    </div>

    <!-- 搜尋列 (附帶小叉叉清除) -->
    <div class="relative pb-1.5 flex items-center">
      <input id="search-input" type="text" placeholder="檢索項目或細項..." class="w-full bg-mono-100 dark:bg-mono-900 border border-mono-200 dark:border-mono-800 text-xs pl-2.5 pr-7 py-1.5 rounded focus:outline-none focus:border-mono-400 dark:focus:border-mono-600 transition-colors placeholder:text-mono-400">
      <button id="search-clear-btn" class="hidden absolute right-2 text-mono-400 hover:text-mono-700 dark:hover:text-mono-200 p-0.5 text-xs focus:outline-none">
        ✕
      </button>
    </div>

    <!-- 標籤按鈕滑動篩選列 (無 # 符號) -->
    <div id="tag-bar-container" class="pb-2 overflow-x-auto no-scrollbar flex items-center space-x-1">
      <!-- 動態插入標籤按鈕 -->
    </div>

    <!-- 列表清單區塊 -->
    <main id="item-list" class="flex-1 space-y-2 pt-0.5 overflow-y-auto">
      <!-- 動態載入項目 -->
    </main>

    <!-- 空狀態 -->
    <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center py-20 text-mono-400 dark:text-mono-600">
      <span class="text-xs font-mono tracking-widest uppercase">無記錄</span>
    </div>

  </div>

  <!-- 底部固定浮動新增按鈕 -->
  <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto px-4 pointer-events-none flex justify-end">
    <button id="open-add-modal" class="pointer-events-auto bg-mono-900 dark:bg-mono-100 text-mono-50 dark:text-mono-900 w-12 h-12 rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-transform" aria-label="新增項目">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path>
      </svg>
    </button>
  </div>

  <!-- 模態框：新增/編輯主項目 -->
  <div id="item-modal" class="fixed inset-0 bg-mono-950/40 backdrop-blur-[2px] z-50 hidden flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-mono-50 dark:bg-mono-900 border border-mono-200 dark:border-mono-800 rounded-xl p-4 space-y-3.5 shadow-2xl transition-all">
      <div class="flex items-center justify-between pb-1 border-b border-mono-200 dark:border-mono-800">
        <h3 id="modal-title" class="text-xs tracking-wider font-semibold text-mono-500">新增項目</h3>
        <button id="close-item-modal" class="text-mono-400 hover:text-mono-900 dark:hover:text-mono-100 text-sm p-1">✕</button>
      </div>

      <form id="item-form" class="space-y-3">
        <input type="hidden" id="edit-item-id">
        
        <div class="grid grid-cols-4 gap-1.5 text-xs">
          <label class="cursor-pointer">
            <input type="radio" name="item-category" value="問題" class="peer sr-only" checked>
            <div class="text-center py-1.5 rounded border border-mono-200 dark:border-mono-800 peer-checked:border-mono-900 dark:peer-checked:border-mono-100 peer-checked:bg-mono-900 peer-checked:text-mono-50 dark:peer-checked:bg-mono-100 dark:peer-checked:text-mono-900 text-mono-600 dark:text-mono-400 transition-all font-medium">問題</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="item-category" value="感恩" class="peer sr-only">
            <div class="text-center py-1.5 rounded border border-mono-200 dark:border-mono-800 peer-checked:border-mono-900 dark:peer-checked:border-mono-100 peer-checked:bg-mono-900 peer-checked:text-mono-50 dark:peer-checked:bg-mono-100 dark:peer-checked:text-mono-900 text-mono-600 dark:text-mono-400 transition-all font-medium">感恩</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="item-category" value="開心" class="peer sr-only">
            <div class="text-center py-1.5 rounded border border-mono-200 dark:border-mono-800 peer-checked:border-mono-900 dark:peer-checked:border-mono-100 peer-checked:bg-mono-900 peer-checked:text-mono-50 dark:peer-checked:bg-mono-100 dark:peer-checked:text-mono-900 text-mono-600 dark:text-mono-400 transition-all font-medium">開心</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="item-category" value="難受" class="peer sr-only">
            <div class="text-center py-1.5 rounded border border-mono-200 dark:border-mono-800 peer-checked:border-mono-900 dark:peer-checked:border-mono-100 peer-checked:bg-mono-900 peer-checked:text-mono-50 dark:peer-checked:bg-mono-100 dark:peer-checked:text-mono-900 text-mono-600 dark:text-mono-400 transition-all font-medium">難受</div>
          </label>
        </div>

        <div>
          <textarea id="item-title-input" required rows="3" placeholder="描述項目內容" class="w-full bg-mono-100 dark:bg-mono-800/60 border border-mono-200 dark:border-mono-700 text-xs px-2.5 py-2 rounded focus:outline-none focus:border-mono-900 dark:focus:border-mono-100 resize-none leading-relaxed"></textarea>
        </div>

        <div>
          <input type="text" id="item-tag-input" placeholder="標籤 (直接輸入或點選下方)" class="w-full bg-mono-100 dark:bg-mono-800/60 border border-mono-200 dark:border-mono-700 text-xs px-2.5 py-1.5 rounded focus:outline-none focus:border-mono-900 dark:focus:border-mono-100">
          <div id="modal-tag-suggestions" class="flex flex-wrap gap-1 mt-1.5"></div>
        </div>

        <div class="pt-1 flex items-center justify-between">
          <button type="button" id="delete-item-modal-btn" class="hidden text-xs text-red-500 hover:text-red-700 transition-colors">刪除項目</button>
          <div class="flex items-center space-x-2 ml-auto">
            <button type="button" id="cancel-item-modal" class="px-3 py-1.5 text-xs text-mono-500 hover:text-mono-900 dark:hover:text-mono-100">取消</button>
            <button type="submit" class="bg-mono-900 dark:bg-mono-100 text-mono-50 dark:text-mono-900 text-xs px-4 py-1.5 rounded font-medium tracking-wide active:scale-95 transition-all">儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 模態框：新增/編輯細項 (小尺寸置中，俐落無多餘說明) -->
  <div id="sub-modal" class="fixed inset-0 bg-mono-950/40 backdrop-blur-[2px] z-50 hidden flex items-center justify-center p-4">
    <div class="w-full max-w-xs bg-mono-50 dark:bg-mono-900 border border-mono-200 dark:border-mono-800 rounded-xl p-3.5 space-y-3 shadow-2xl transition-all">
      <div class="flex items-center justify-between pb-1 border-b border-mono-200 dark:border-mono-800">
        <h3 id="sub-modal-header" class="text-xs font-semibold text-mono-700 dark:text-mono-300">新增細項</h3>
        <button id="close-sub-modal" class="text-mono-400 hover:text-mono-900 dark:hover:text-mono-100 text-xs p-0.5">✕</button>
      </div>

      <form id="sub-form" class="space-y-2.5">
        <input type="hidden" id="sub-parent-id">
        <input type="hidden" id="sub-edit-id">
        <input type="hidden" id="sub-auto-created-date">

        <!-- 自動記錄新增日提示 -->
        <div class="text-[10px] text-mono-400 dark:text-mono-500 font-mono flex items-center justify-between pb-0.5">
          <span>自動記錄 新增日</span>
          <span id="sub-display-created-date"></span>
        </div>

        <!-- 指定歸屬主項目 (常駐區塊快速新增時可選) -->
        <div id="sub-parent-select-wrapper" class="hidden">
          <span class="block text-[10px] text-mono-400 mb-0.5">指定歸屬項目</span>
          <select id="sub-parent-select" class="w-full bg-mono-100 dark:bg-mono-800/60 border border-mono-200 dark:border-mono-700 text-xs px-2 py-1.5 rounded focus:outline-none">
            <!-- 動態填入進行中的項目 -->
          </select>
        </div>

        <div>
          <input type="text" id="sub-content-input" required placeholder="細項內容" class="w-full bg-mono-100 dark:bg-mono-800/60 border border-mono-200 dark:border-mono-700 text-xs px-2.5 py-1.5 rounded focus:outline-none focus:border-mono-900 dark:focus:border-mono-100">
        </div>

        <div>
          <textarea id="sub-notes-input" rows="2" placeholder="備註 (選填)" class="w-full bg-mono-100 dark:bg-mono-800/60 border border-mono-200 dark:border-mono-700 text-xs px-2.5 py-1.5 rounded focus:outline-none focus:border-mono-900 dark:focus:border-mono-100"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <span class="block text-[10px] text-mono-400 mb-0.5">+ 計畫執行日</span>
            <input type="date" id="sub-target-date" class="w-full bg-mono-100 dark:bg-mono-800/60 border border-mono-200 dark:border-mono-700 text-[11px] px-1.5 py-1 rounded font-mono focus:outline-none">
          </div>
          <div>
            <span class="block text-[10px] text-mono-400 mb-0.5">✓ 實際完成日</span>

  <!-- 資料管理/備份彈窗 -->

  <script>
    /* ==========================================================================
       狀態與預設資料
       ========================================================================== */
    const STORAGE_KEY = 'observer_pwa_records_v2';
    const THEME_KEY = 'observer_theme_pref';

    const defaultInitialData = [
      {
        id: '1',
        category: '問題',
        title: '網頁曝光下降',
        tag: '工作',
        archived: false,
        createdAt: '2026/09/20',
        items: [
          {
            id: 'sub-1-1',
            content: '調整關鍵字',
            notes: '重新修訂 SEO 元標籤與熱門搜索詞彙',
            createdDate: '2026/10/30',
            targetDate: '2026/11/01',
            completedDate: '2026/11/01'
          },
          {
            id: 'sub-1-2',
            content: '新增內容',
            notes: '每週產出兩篇長文深度分析',
            createdDate: '2026/09/23',
            targetDate: '2026/11/01',
            completedDate: ''
          }
        ]
      },
      {
        id: '2',
        category: '感恩',
        title: '謝謝男友的付出',
        tag: '感情',
        archived: false,
        createdAt: '2026/10/10',
        items: [
          {
            id: 'sub-2-1',
            content: '買生日禮物',
            notes: '挑選機械鍵盤與手寫卡片',
            createdDate: '2026/10/12',
            targetDate: '2026/11/05',
            completedDate: ''
          }
        ]
      },
      {
        id: '3',
        category: '開心',
        title: '每天觀察一個幸福的瞬間',
        tag: '日常',
        archived: false,
        createdAt: '2026/08/15',
        items: [
          {
            id: 'sub-3-1',
            content: '雨過天晴的彩虹',
            notes: '下午四點下班路上的雙彩虹，空氣清新',
            createdDate: '2026/08/17',
            targetDate: '2026/08/17',
            completedDate: ''
          }
        ]
      }
    ];

    let records = [];
    let currentCategory = 'all';
    let currentTag = 'all';
    let searchQuery = '';
    let currentViewMode = 'active'; // 'active' | 'archived'
    let expandedSubItems = new Set(); // 記錄目前展開查看詳情的細項 ID
    let expandedCardIds = new Set(); // 記錄目前展開細項的主項目 ID (預設全部收合)
    let isManageMode = false; // 是否進入「整理」模式
    let calendarDate = new Date(); // 日曆目前的檢視月份
    let selectedCalendarDateKey = null; // 日曆目前點擊選取的日期 (預設未選取)

    /* ==========================================================================
       初始化 & 主題設置 (預設淺色模式)
       ========================================================================== */
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      applyTheme(savedTheme);
      renderHeaderDate();
    }

    function renderHeaderDate() {
      const d = new Date();
      const m = d.getMonth() + 1;
      const date = d.getDate();
      const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const day = days[d.getDay()];
      const el = document.getElementById('header-today-date');
      if (el) el.textContent = `${m}月${date}日${day}`;
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const themeColorMeta = document.getElementById('theme-color-meta');
      if (theme === 'dark') {
        html.classList.add('dark');
        html.classList.remove('light');
        if (themeColorMeta) themeColorMeta.setAttribute('content', '#0a0a0a');
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        if (themeColorMeta) themeColorMeta.setAttribute('content', '#ffffff');
      }
      localStorage.setItem(THEME_KEY, theme);
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    });

    /* ==========================================================================
       檢視切換：進行中 / 封存
       ========================================================================== */
    const viewActiveBtn = document.getElementById('view-active-btn');
    const viewArchivedBtn = document.getElementById('view-archived-btn');

    viewActiveBtn.addEventListener('click', () => {
      currentViewMode = 'active';
      updateViewTabs();
      renderList();
    });

    viewArchivedBtn.addEventListener('click', () => {
      currentViewMode = 'archived';
      updateViewTabs();
      renderList();
    });

    const toggleManageBtn = document.getElementById('toggle-manage-btn');
    const manageBtnText = document.getElementById('manage-btn-text');

    toggleManageBtn.addEventListener('click', () => {
      isManageMode = !isManageMode;
      if (isManageMode) {
        toggleManageBtn.className = 'text-[11px] px-2 py-0.5 rounded border border-mono-900 bg-mono-900 text-mono-50 dark:border-mono-100 dark:bg-mono-100 dark:text-mono-900 transition-all font-mono flex items-center space-x-1';
        manageBtnText.textContent = '完成';
      } else {
        toggleManageBtn.className = 'text-[11px] px-2 py-0.5 rounded border border-mono-200 dark:border-mono-800 text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 hover:border-mono-400 transition-all font-mono flex items-center space-x-1';
        manageBtnText.textContent = '整理';
      }
      renderList();
    });

    function updateViewTabs() {
      const activeLabel = viewActiveBtn.querySelector('.tab-label');
      const archiveLabel = viewArchivedBtn.querySelector('.tab-label');

      if (currentViewMode === 'active') {
        viewActiveBtn.className = 'flex items-center space-x-1.5 text-xs font-medium text-mono-900 dark:text-mono-100';
        activeLabel.className = 'tab-label underline underline-offset-4 decoration-1';

        viewArchivedBtn.className = 'flex items-center space-x-1.5 text-xs text-mono-400 hover:text-mono-700 dark:hover:text-mono-300 transition-colors';
        archiveLabel.className = 'tab-label';
      } else {
        viewActiveBtn.className = 'flex items-center space-x-1.5 text-xs text-mono-400 hover:text-mono-700 dark:hover:text-mono-300 transition-colors';
        activeLabel.className = 'tab-label';

        viewArchivedBtn.className = 'flex items-center space-x-1.5 text-xs font-medium text-mono-900 dark:text-mono-100';
        archiveLabel.className = 'tab-label underline underline-offset-4 decoration-1';
      }
    }

    /* ==========================================================================
       資料操作
       ========================================================================== */
    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          records = JSON.parse(raw);
          records.forEach(r => {
            if (r.archived === undefined) r.archived = false;
            if (r.pinned === undefined) r.pinned = false;
            if (r.items) {
              r.items.forEach(sub => {
                if (!sub.createdDate) sub.createdDate = r.createdAt || getTodayString();
                // 向後相容：若無 targetDate 則以 createdDate 或已完成日替代
                if (sub.targetDate === undefined) {
                  sub.targetDate = sub.completedDate || sub.createdDate;
                }
              });
            }
          });
        } catch (e) {
          records = defaultInitialData;
        }
      } else {
        records = defaultInitialData;
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderList();
      renderCalendar();
    }

    function formatDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}/${m}/${d}`;
    }

    function toInputDateFormat(slashDate) {
      if (!slashDate) return '';
      return slashDate.replace(/\//g, '-');
    }

    function fromInputDateFormat(dashDate) {
      if (!dashDate) return '';
      return dashDate.replace(/-/g, '/');
    }

    function getTodayString() {
      return formatDate(new Date());
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getAllExistingTags() {
      const tags = new Set();
      records.forEach(r => {
        if (r.tag && r.tag.trim()) {
          r.tag.split(/[\s,]+/).filter(Boolean).forEach(t => tags.add(t));
        }
      });
      return Array.from(tags);
    }

    function setFilterTag(tag) {
      currentTag = (currentTag === tag) ? 'all' : tag;
      renderList();
    }

    window.toggleSubExpand = function(subId) {
      if (expandedSubItems.has(subId)) {
        expandedSubItems.delete(subId);
      } else {
        expandedSubItems.add(subId);
      }
      renderList();
    };

    window.toggleCardExpansion = function(itemId) {
      if (expandedCardIds.has(itemId)) {
        expandedCardIds.delete(itemId);
      } else {
        expandedCardIds.add(itemId);
      }
      renderList();
    };

    function toggleArchiveItem(id) {
      const target = records.find(r => r.id === id);
      if (target) {
        target.archived = !target.archived;
        saveData();
      }
    }

    window.togglePinItem = function(id) {
      const target = records.find(r => r.id === id);
      if (target) {
        target.pinned = !target.pinned;
        saveData();
      }
    };

    /* ==========================================================================
       渲染今日預計完成區塊 (常駐區塊)
       ========================================================================== */
    function renderTodayTasks() {
      const listEl = document.getElementById('today-tasks-list');
      const countEl = document.getElementById('today-tasks-count');
      const today = getTodayString();

      // 篩選條件：
      // 1. 未完成且計畫執行日 <= 今日（今日到期或逾期）
      // 2. 或今日剛完成的細項
      // 3. 未來日期的細項在該天到來前不在此顯示
      const todayTasks = [];
      records.filter(r => !r.archived).forEach(item => {
        (item.items || []).forEach(sub => {
          const tDate = sub.targetDate || '';
          const isDone = Boolean(sub.completedDate);

          const isDueOrPast = tDate && tDate <= today;
          const isCompletedToday = sub.completedDate === today;

          if ((!isDone && isDueOrPast) || isCompletedToday) {
            todayTasks.push({ parentId: item.id, parentTitle: item.title, sub });
          }
        });
      });

      countEl.textContent = todayTasks.length;

      if (todayTasks.length === 0) {
        listEl.innerHTML = `
          <li class="text-[11px] font-mono text-mono-400 dark:text-mono-600 py-1 flex items-center justify-between">
            <span>今日無待辦任務</span>
          </li>
        `;
        return;
      }

      listEl.innerHTML = todayTasks.map(t => {
        const isDone = Boolean(t.sub.completedDate);
        const isOverdue = !isDone && t.sub.targetDate && t.sub.targetDate < today;
        return `
          <li class="flex items-center justify-between text-xs py-1 border-b border-mono-100/60 dark:border-mono-800/30 last:border-none">
            <div class="flex items-center space-x-2 flex-1 min-w-0 pr-2">
              <button type="button" onclick="event.stopPropagation(); toggleSubComplete('${t.parentId}', '${t.sub.id}')" class="shrink-0 focus:outline-none">
                ${isDone 
                  ? `<span class="w-3.5 h-3.5 rounded-full bg-blue-600 flex items-center justify-center text-white">
                       <svg class="w-2.2 h-2.2" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                         <polyline points="2.5 6 4.8 8.5 9.5 3.5"></polyline>
                       </svg>
                     </span>`
                  : `<span class="w-3.5 h-3.5 rounded-full border border-mono-300 dark:border-mono-600 block hover:border-blue-500 transition-colors"></span>`
                }
              </button>
              <!-- 點選細項內容可直接開啟編輯 -->
              <span onclick="editSubItem('${t.parentId}', '${t.sub.id}')" title="點擊編輯細項" class="truncate text-mono-800 dark:text-mono-200 select-none cursor-pointer hover:underline decoration-mono-300 dark:decoration-mono-700 decoration-1">
                ${escapeHtml(t.sub.content)}
              </span>
              <!-- Enter 彎曲箭頭表示母項目 (點擊可跳轉至下方對應項目) -->
              <button type="button" onclick="event.stopPropagation(); jumpToItem('${t.parentId}', false)" title="跳轉至此項目" class="inline-flex items-center space-x-0.5 text-[10px] text-mono-400 dark:text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 hover:underline decoration-1 shrink-0 transition-colors focus:outline-none cursor-pointer">
                <svg class="w-2.5 h-2.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 10 4 15 9 20"></polyline>
                  <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                </svg>
                <span>${escapeHtml(t.parentTitle)}</span>
              </button>
            </div>
            ${isDone 
              ? `<span class="text-[10px] font-mono text-blue-600 dark:text-blue-400 shrink-0">已完成</span>` 
              : (isOverdue ? `
                <button type="button" onclick="editSubItem('${t.parentId}', '${t.sub.id}')" title="點擊編輯細項" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-mono-200/80 dark:bg-mono-800 text-mono-600 dark:text-mono-400 shrink-0 hover:bg-mono-300 dark:hover:bg-mono-700 transition-colors cursor-pointer">
                  逾期
                </button>
              ` : '')
            }
          </li>
        `;
      }).join('');
    }

    /* ==========================================================================
       小日曆視圖邏輯與渲染 (列表方式呈現完成細項)
       ========================================================================== */
    const calendarDrawer = document.getElementById('calendar-drawer');
    const toggleCalendarBtn = document.getElementById('toggle-calendar-btn');
    const calPrevMonthBtn = document.getElementById('cal-prev-month');
    const calNextMonthBtn = document.getElementById('cal-next-month');
    const calYearSelect = document.getElementById('cal-year-select');
    const calMonthSelect = document.getElementById('cal-month-select');
    const calThisMonthBtn = document.getElementById('cal-this-month-btn');
    const calDaysGrid = document.getElementById('cal-days-grid');
    const calSelectedDayContainer = document.getElementById('cal-selected-day-container');
    const calSelectedDateLabel = document.getElementById('cal-selected-date-label');
    const calSelectedCount = document.getElementById('cal-selected-count');
    const calSelectedItemsList = document.getElementById('cal-selected-items-list');

    function initCalendarSelects() {
      if (!calYearSelect || !calMonthSelect) return;
      const currentYear = new Date().getFullYear();
      let yearHtml = '';
      for (let y = currentYear - 5; y <= currentYear + 5; y++) {
        yearHtml += `<option value="${y}">${y}年</option>`;
      }
      calYearSelect.innerHTML = yearHtml;

      let monthHtml = '';
      for (let m = 0; m < 12; m++) {
        monthHtml += `<option value="${m}">${m + 1}月</option>`;
      }
      calMonthSelect.innerHTML = monthHtml;

      calYearSelect.addEventListener('change', (e) => {
        calendarDate.setFullYear(parseInt(e.target.value, 10));
        renderCalendar();
      });

      calMonthSelect.addEventListener('change', (e) => {
        calendarDate.setMonth(parseInt(e.target.value, 10));
        renderCalendar();
      });

      if (calThisMonthBtn) {
        calThisMonthBtn.addEventListener('click', () => {
          calendarDate = new Date();
          renderCalendar();
        });
      }
    }

    toggleCalendarBtn.addEventListener('click', () => {
      calendarDrawer.classList.toggle('hidden');
      if (!calendarDrawer.classList.contains('hidden')) {
        renderCalendar();
      }
    });

    calPrevMonthBtn.addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    });

    calNextMonthBtn.addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    });

    function getCompletedItemsMap() {
      // 收集每個完成日期對應的項目清單
      const map = {};
      records.forEach(item => {
        (item.items || []).forEach(sub => {
          if (sub.completedDate) {
            if (!map[sub.completedDate]) map[sub.completedDate] = [];
            map[sub.completedDate].push({ parentId: item.id, parentTitle: item.title, isArchived: Boolean(item.archived), sub });
          }
        });
      });
      return map;
    }

    function getRecordedDaysSet() {
      // 收集所有產生紀錄的日期（包含新增記錄日或完成日）
      const recordedSet = new Set();
      records.forEach(item => {
        (item.items || []).forEach(sub => {
          if (sub.createdDate) recordedSet.add(sub.createdDate);
          if (sub.completedDate) recordedSet.add(sub.completedDate);
        });
      });
      return recordedSet;
    }

    function renderCalendar() {
      if (calendarDrawer.classList.contains('hidden')) return;

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      if (calYearSelect && calMonthSelect) {
        calYearSelect.value = year;
        calMonthSelect.value = month;
      }

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const todayStr = getTodayString();

      const recordedDays = getRecordedDaysSet();
      const completedMap = getCompletedItemsMap();

      let daysHtml = '';

      // 填充月初空白
      for (let i = 0; i < firstDayIndex; i++) {
        daysHtml += `<div class="py-1"></div>`;
      }

      // 渲染整月天數
      for (let day = 1; day <= lastDay; day++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateKey = `${year}/${mStr}/${dStr}`;

        const isToday = (dateKey === todayStr);
        const isSelected = (dateKey === selectedCalendarDateKey);
        const hasRecords = recordedDays.has(dateKey);
        const hasCompleted = Boolean(completedMap[dateKey] && completedMap[dateKey].length > 0);

        // 樣式：選取中 > 今天 > 一般
        let dayBtnStyle = 'hover:bg-mono-200/70 dark:hover:bg-mono-800 text-mono-700 dark:text-mono-300';
        if (isSelected) {
          dayBtnStyle = 'bg-mono-900 text-mono-50 dark:bg-mono-100 dark:text-mono-900 font-semibold ring-1 ring-mono-900 dark:ring-mono-100';
        } else if (isToday) {
          dayBtnStyle = 'border border-mono-900 dark:border-mono-100 font-semibold text-mono-900 dark:text-mono-100';
        }

        daysHtml += `
          <button type="button" onclick="selectCalendarDate('${dateKey}')" class="group relative flex flex-col items-center justify-center py-1 rounded transition-all ${dayBtnStyle}">
            <span>${day}</span>
            <div class="h-1 flex items-center justify-center mt-0.5">
              ${hasRecords ? `
                <span class="w-1 h-1 rounded-full ${isSelected ? (document.documentElement.classList.contains('dark') ? 'bg-mono-950' : 'bg-white') : (hasCompleted ? 'bg-blue-600 dark:bg-blue-400' : 'bg-mono-400 dark:bg-mono-500')}"></span>
              ` : ''}
            </div>
          </button>
        `;
      }

      calDaysGrid.innerHTML = daysHtml;
      renderSelectedDayList();
    }

    window.selectCalendarDate = function(dateKey) {
      if (selectedCalendarDateKey === dateKey) {
        selectedCalendarDateKey = null; // 再次點擊取消選取
      } else {
        selectedCalendarDateKey = dateKey;
      }
      renderCalendar();
    };

    function renderSelectedDayList() {
      if (!selectedCalendarDateKey) {
        calSelectedDayContainer.classList.add('hidden');
        return;
      }

      calSelectedDayContainer.classList.remove('hidden');

    window.jumpToItem = function(parentId, isArchived) {
      // 依項目封存狀態自動切換分頁
      const shouldBeArchived = (isArchived === 'true' || isArchived === true);
      currentViewMode = shouldBeArchived ? 'archived' : 'active';
      currentCategory = 'all';
      currentTag = 'all';
      searchQuery = '';
      if (searchInput) searchInput.value = '';
      if (searchClearBtn) searchClearBtn.classList.add('hidden');
      updateViewTabs();

      // 展開該項目的細項區塊
      expandedCardIds.add(parentId);
      renderList();

      // 平滑滾動至該項目並閃爍高亮
      setTimeout(() => {
        const targetElement = document.querySelector(`[data-drag-id="${parentId}"]`);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const cardBody = targetElement.querySelector('article');
          if (cardBody) {
            cardBody.classList.add('ring-2', 'ring-mono-900', 'dark:ring-mono-100');
            setTimeout(() => {
              cardBody.classList.remove('ring-2', 'ring-mono-900', 'dark:ring-mono-100');
            }, 1200);
          }
        }
      }, 100);
    };

    document.getElementById('quick-add-today-task-btn').addEventListener('click', () => {
      openSubModal(null, true);
    });

    /* ==========================================================================
       刪除確認對話框邏輯
       ========================================================================== */
    const confirmModal = document.getElementById('confirm-modal');
    const confirmTitle = document.getElementById('confirm-title');
    const confirmDesc = document.getElementById('confirm-desc');
    const confirmCancelBtn = document.getElementById('confirm-cancel-btn');
    const confirmActionBtn = document.getElementById('confirm-action-btn');
    let onConfirmCallback = null;

    function showConfirmDialog(title, desc, onConfirm) {
      if (!confirmModal) return;
      confirmTitle.textContent = title || '確認刪除？';
      confirmDesc.textContent = desc || '刪除後將無法復原此內容。';
      onConfirmCallback = onConfirm;
      confirmModal.classList.remove('hidden');
    }

    function closeConfirmDialog() {
      if (!confirmModal) return;
      confirmModal.classList.add('hidden');
      onConfirmCallback = null;
    }

    if (confirmCancelBtn) {
      confirmCancelBtn.addEventListener('click', closeConfirmDialog);
    }
    if (confirmActionBtn) {
      confirmActionBtn.addEventListener('click', () => {
        if (typeof onConfirmCallback === 'function') {
          onConfirmCallback();
        }
        closeConfirmDialog();
      });
    }

    window.confirmDeleteItem = function(id) {
      const item = records.find(r => r.id === id);
      const title = item ? item.title : '此項目';
      showConfirmDialog(`刪除「${title}」？`, '刪除後項目及其所有細項將無法復原。', () => {
        records = records.filter(r => r.id !== id);
        saveData();
      });
    };

    window.confirmDeleteSub = function(parentId, subId) {
      showConfirmDialog('刪除此細項？', '刪除後該紀錄將無法復原。', () => {
        const parent = records.find(r => r.id === parentId);
        if (parent) {
          parent.items = parent.items.filter(s => s.id !== subId);
          saveData();
        }
      });

    /* ==========================================================================
       左滑封存、右滑刪除手勢綁定 (僅在整理模式啟用)
       ========================================================================== */
    function initSwipeGestures() {
      const cards = document.querySelectorAll('.swipeable-card');

      cards.forEach(card => {
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let isSwiping = false;
        const itemId = card.dataset.itemId;
        const threshold = 75; // 觸發位移門檻

        function onTouchStart(e) {
          if (!isManageMode) return;
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX;
          startY = touch.clientY;
          isSwiping = true;
          card.style.transition = 'none';
        }

        function onTouchMove(e) {
          if (!isSwiping || !isManageMode) return;
          const touch = e.touches ? e.touches[0] : e;
          const diffX = touch.clientX - startX;
          const diffY = touch.clientY - startY;

          // 若垂直滑動大於水平滑動，視為頁面滾動，不做水平位移
          if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffX) < 15) {
            return;
          }

          currentX = diffX;
          // 阻尼效果
          const dampedX = Math.sign(currentX) * Math.min(Math.abs(currentX), 120);
          card.style.transform = `translateX(${dampedX}px)`;
        }

        function onTouchEnd() {
          if (!isSwiping || !isManageMode) return;
          isSwiping = false;
          card.style.transition = 'transform 0.2s ease-out';
          
          if (currentX > threshold) {
            // 左滑到右 (diffX > 0)：封存 / 解除封存
            card.style.transform = 'translateX(100%)';
            setTimeout(() => {
              toggleArchiveItem(itemId);
            }, 180);
          } else if (currentX < -threshold) {
            // 右滑到左 (diffX < 0)：刪除
            card.style.transform = 'translateX(-100%)';
            setTimeout(() => {
              confirmDeleteItem(itemId);
              card.style.transform = 'translateX(0px)';
            }, 180);
          } else {
            // 回彈
            card.style.transform = 'translateX(0px)';
          }
          currentX = 0;
        }

        // 綁定觸控事件
        card.addEventListener('touchstart', onTouchStart, { passive: true });
        card.addEventListener('touchmove', onTouchMove, { passive: true });
        card.addEventListener('touchend', onTouchEnd);
        card.addEventListener('touchcancel', onTouchEnd);
      });
    }

    const closeItemModalBtn = document.getElementById('close-item-modal');
    const cancelItemModalBtn = document.getElementById('cancel-item-modal');
    const deleteItemModalBtn = document.getElementById('delete-item-modal-btn');

    function renderTagSuggestions() {
      const container = document.getElementById('modal-tag-suggestions');
      const allTags = getAllExistingTags();
      if (!container) return;
      if (allTags.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = allTags.map(tag => `
        <button type="button" onclick="selectSuggestionTag('${escapeHtml(tag)}')" class="text-[10px] px-2 py-0.5 rounded bg-mono-200 dark:bg-mono-800 text-mono-700 dark:text-mono-300 hover:bg-mono-300 dark:hover:bg-mono-700 transition-colors">
          ${escapeHtml(tag)}
        </button>
      `).join('');
    }

    window.selectSuggestionTag = function(tag) {
      const input = document.getElementById('item-tag-input');
      const current = input.value.trim();
      if (!current) {
        input.value = tag;
      } else {
        const tags = current.split(/[\s,]+/).filter(Boolean);
        if (!tags.includes(tag)) {
          input.value = current + ' ' + tag;
        }
      }
      input.focus();
    };

    function openItemModal(isEdit = false, itemData = null) {
      itemModal.classList.remove('hidden');
      renderTagSuggestions();

      if (isEdit && itemData) {
        document.getElementById('modal-title').textContent = '編輯項目';
        document.getElementById('edit-item-id').value = itemData.id;
        document.getElementById('item-title-input').value = itemData.title;
        document.getElementById('item-tag-input').value = itemData.tag || '';
        deleteItemModalBtn.classList.remove('hidden');
        const radio = document.querySelector(`input[name="item-category"][value="${itemData.category}"]`);
        if (radio) radio.checked = true;
      } else {
        document.getElementById('modal-title').textContent = '新增項目';
        document.getElementById('edit-item-id').value = '';
        deleteItemModalBtn.classList.add('hidden');
        itemForm.reset();
        if (currentCategory !== 'all') {
          const radio = document.querySelector(`input[name="item-category"][value="${currentCategory}"]`);
          if (radio) radio.checked = true;
        }
      }
      setTimeout(() => document.getElementById('item-title-input').focus(), 50);
    }

    function closeItemModal() {
      itemModal.classList.add('hidden');
    }

    openAddModalBtn.addEventListener('click', () => openItemModal(false));
    closeItemModalBtn.addEventListener('click', closeItemModal);
    cancelItemModalBtn.addEventListener('click', closeItemModal);

    deleteItemModalBtn.addEventListener('click', () => {
      const editId = document.getElementById('edit-item-id').value;
      if (editId) {
        closeItemModal();
        confirmDeleteItem(editId);
      }
    });

    itemForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('edit-item-id').value;
      const title = document.getElementById('item-title-input').value.trim();
      const tag = document.getElementById('item-tag-input').value.trim();
      const category = document.querySelector('input[name="item-category"]:checked').value;

      if (!title) return;

      if (editId) {
        const target = records.find(r => r.id === editId);
        if (target) {
          target.title = title;
          target.tag = tag;
          target.category = category;
        }
      } else {
        const newItem = {
          id: Date.now().toString(),
          category,
          title,
          tag,
          archived: false,
          pinned: false,
          createdAt: getTodayString(),
          items: []
        };
        records.unshift(newItem);
      }

      saveData();
      closeItemModal();
    });

    window.editItem = function(id) {
      const item = records.find(r => r.id === id);
      if (item) {
        openItemModal(true, item);
      }
    };

    /* ==========================================================================
       細項 (Sub-Item) 新增 / 編輯 / 標記
       ========================================================================== */
    const subModal = document.getElementById('sub-modal');
    const subForm = document.getElementById('sub-form');
    const subModalHeader = document.getElementById('sub-modal-header');
    const subSubmitBtn = document.getElementById('sub-submit-btn');
    const closeSubModalBtn = document.getElementById('close-sub-modal');
    const cancelSubModalBtn = document.getElementById('cancel-sub-modal');
    const subParentSelectWrapper = document.getElementById('sub-parent-select-wrapper');
    const subParentSelect = document.getElementById('sub-parent-select');

    window.openSubModal = function(parentId = null, isFromTodaySection = false) {
      const activeProjects = records.filter(r => !r.archived);

      if (activeProjects.length === 0) {
        showConfirmDialog('尚無進行中的項目', '請先新增一個項目，再為其指派細項。', () => {
          openItemModal(false);
        });
        return;
      }

      subModal.classList.remove('hidden');
      subModalHeader.textContent = isFromTodaySection ? '新增今日預計細項' : '新增細項';
      subSubmitBtn.textContent = '加入';
      document.getElementById('sub-edit-id').value = '';
      document.getElementById('sub-content-input').value = '';
      document.getElementById('sub-notes-input').value = '';
      
      const todayStr = getTodayString();
      document.getElementById('sub-auto-created-date').value = todayStr;
      document.getElementById('sub-display-created-date').textContent = todayStr;

      // 今天日期（預設計畫執行日為今日）
      const todayIso = new Date().toISOString().split('T')[0];
      document.getElementById('sub-target-date').value = todayIso;
      document.getElementById('sub-completed-date').value = '';

      if (isFromTodaySection || !parentId) {
        subParentSelectWrapper.classList.remove('hidden');
        subParentSelect.innerHTML = activeProjects.map(p => `
          <option value="${p.id}">${escapeHtml(p.title)} (${escapeHtml(p.category)})</option>
        `).join('');
        document.getElementById('sub-parent-id').value = activeProjects[0].id;
      } else {
        subParentSelectWrapper.classList.add('hidden');
        document.getElementById('sub-parent-id').value = parentId;
      }

      setTimeout(() => document.getElementById('sub-content-input').focus(), 50);
    };

    window.editSubItem = function(parentId, subId) {
      const parent = records.find(r => r.id === parentId);
      if (!parent) return;
      const sub = parent.items.find(s => s.id === subId);
      if (!sub) return;

      subModal.classList.remove('hidden');
      subModalHeader.textContent = '編輯細項';
      subSubmitBtn.textContent = '儲存';
      subParentSelectWrapper.classList.add('hidden');

      document.getElementById('sub-parent-id').value = parentId;
      document.getElementById('sub-edit-id').value = subId;
      document.getElementById('sub-content-input').value = sub.content;
      document.getElementById('sub-notes-input').value = sub.notes || '';
      
      const createdDateVal = sub.createdDate || getTodayString();
      document.getElementById('sub-auto-created-date').value = createdDateVal;
      document.getElementById('sub-display-created-date').textContent = createdDateVal;
      
      document.getElementById('sub-target-date').value = toInputDateFormat(sub.targetDate || '');
      document.getElementById('sub-completed-date').value = toInputDateFormat(sub.completedDate || '');

      setTimeout(() => document.getElementById('sub-content-input').focus(), 50);
    };

    function closeSubModal() {
      subModal.classList.add('hidden');
    }

    closeSubModalBtn.addEventListener('click', closeSubModal);
    cancelSubModalBtn.addEventListener('click', closeSubModal);

    subForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const parentId = subParentSelectWrapper.classList.contains('hidden') 
        ? document.getElementById('sub-parent-id').value 
        : subParentSelect.value;
      const editSubId = document.getElementById('sub-edit-id').value;
      const content = document.getElementById('sub-content-input').value.trim();
      const notes = document.getElementById('sub-notes-input').value.trim();
      const autoCreatedDate = document.getElementById('sub-auto-created-date').value || getTodayString();
      const targetDate = fromInputDateFormat(document.getElementById('sub-target-date').value);
      const completedDate = fromInputDateFormat(document.getElementById('sub-completed-date').value);

      if (!content) return;

      const parent = records.find(r => r.id === parentId);
      if (parent) {
        if (!parent.items) parent.items = [];
        if (editSubId) {
          const sub = parent.items.find(s => s.id === editSubId);
          if (sub) {
            sub.content = content;
            sub.notes = notes;
            sub.createdDate = autoCreatedDate;
            sub.targetDate = targetDate;
            sub.completedDate = completedDate || '';
          }
        } else {
          const newSubId = 'sub-' + Date.now().toString();
          parent.items.push({
            id: newSubId,
            content,
            notes,
            createdDate: autoCreatedDate,
            targetDate: targetDate || getTodayString(),
            completedDate: completedDate || ''
          });
        }
        saveData();
      }
      closeSubModal();
    });

    window.toggleSubComplete = function(parentId, subId) {
      const parent = records.find(r => r.id === parentId);
      if (parent) {
        const sub = parent.items.find(s => s.id === subId);
        if (sub) {
          if (sub.completedDate) {
            sub.completedDate = '';
          } else {
            sub.completedDate = getTodayString();
          }
          saveData();
        }
      }
    };

    /* ==========================================================================
       備份與導出功能
       ========================================================================== */
    const backupModal = document.getElementById('backup-modal');
    const backupBtn = document.getElementById('backup-btn');
    const closeBackupModalBtn = document.getElementById('close-backup-modal');
    const exportBtn = document.getElementById('export-json-btn');
    const importInput = document.getElementById('import-json-input');

    backupBtn.addEventListener('click', () => backupModal.classList.remove('hidden'));
    closeBackupModalBtn.addEventListener('click', () => backupModal.classList.add('hidden'));

    exportBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cundu_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    importInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            records = imported;
            saveData();
            backupModal.classList.add('hidden');
          }
        } catch (err) {}
      };
      reader.readAsText(file);
    });

    /* ==========================================================================
       搜尋與四宮格點選事件
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      if (searchQuery) {
        searchClearBtn.classList.remove('hidden');
      } else {
        searchClearBtn.classList.add('hidden');
      }
      renderList();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClearBtn.classList.add('hidden');
      searchInput.focus();
      renderList();
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.category;
        currentCategory = (currentCategory === cat) ? 'all' : cat;
        renderList();
      });
    });

    /* ==========================================================================
       啟動
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      initPWA();
      initTheme();
      initCalendarSelects();
      loadData();
    });

    /* ==========================================================================
       Android PWA 安裝標準設定 (Service Worker + Manifest + Icons)
       ========================================================================== */
    function initPWA() {
      // 1. 動態繪製 192x192 與 512x512 圖示供 Android 安裝規範使用
      function createIconDataUrl(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        // 背景黑底
        ctx.fillStyle = '#171717';
        ctx.fillRect(0, 0, size, size);
        
        // 置中白色「寸」字
        ctx.fillStyle = '#ffffff';
        ctx.font = `600 ${Math.floor(size * 0.52)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('寸', size / 2, size / 2 + size * 0.03);
        
        return canvas.toDataURL('image/png');
      }

      try {
        const icon192 = createIconDataUrl(192);
        const icon512 = createIconDataUrl(512);

        // 2. 構建符合 W3C 與 Chrome 要求的完整 Manifest
        const currentPath = window.location.pathname;
        const manifestObj = {
          name: "寸度 - 觀察與改變軌跡",
          short_name: "寸度",
          description: "極簡俐落的個人日常觀察與行動軌跡記錄應用",
          start_url: currentPath,
          scope: currentPath.substring(0, currentPath.lastIndexOf('/') + 1),
          id: currentPath,
          display: "standalone",
          orientation: "portrait",
          background_color: "#ffffff",
          theme_color: "#171717",
          icons: [
            {
              src: icon192,
              sizes: "192x192",
              type: "image/png",
              purpose: "any maskable"
            },
            {
              src: icon512,
              sizes: "512x512",
              type: "image/png",
              purpose: "any maskable"
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('pwa-manifest');
        if (manifestLink) {
          manifestLink.setAttribute('href', manifestUrl);
        }

        // 3. 註冊內嵌式 Service Worker (Android 安裝必備條件)
        if ('serviceWorker' in navigator) {
          const swCode = `
            const CACHE_NAME = 'cundu-cache-v1';
            self.addEventListener('install', (e) => {
              self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
              e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (e) => {
              // 網路優先，離線時使用快取
              if (e.request.method !== 'GET') return;
              e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request))
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);

          navigator.serviceWorker.register(swUrl)
            .then(reg => {
              console.log('PWA Service Worker 註冊成功', reg.scope);
            })
            .catch(err => {
              console.warn('Service Worker 註冊受限（需在 HTTPS/GitHub Pages 環境運行）:', err);
            });
        }
      } catch (e) {
        console.error('初始化 PWA 失敗:', e);
      }
    }
  </script>
</body>
</html>
